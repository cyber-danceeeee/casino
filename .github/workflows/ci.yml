name: Verify unified project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [h5, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: matrix.app == 'admin'
        run: npm test
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test ./...
        working-directory: server
  docker:
    runs-on: ubuntu-latest
    env:
      H5_PORT: '18080'
      ADMIN_PORT: '18081'
      BIND_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/init-env.py
      - run: docker compose up -d --build --wait --wait-timeout 600
      - run: python3 scripts/smoke-test.py
      - name: Verify direct H5 configuration
        run: python3 scripts/test-single-site.py --disposable
      - name: Verify single-site database structure
        run: |
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u casino game_casino --batch --skip-column-names -e "SELECT IF((SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND COLUMN_NAME LIKE CHAR(116,101,110,97,110,116,37))=0 AND (SELECT COUNT(*) FROM game_site_config)=1, CHAR(111,107), CHAR(102,97,105,108));"' | grep -qx ok
      - name: Check migration replay
        run: docker compose run --rm migrate
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
