<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>White Label</title>
  <style>
    :root {
      --color-primary: #e53935;
      --color-secondary: #ffb300;
      --color-accent: #00bcd4;
      --color-background: #101010;
      --color-card: #1a1a1a;
      --color-button: #e53935;
      --color-text: #f6f6f6;
      --color-muted: rgba(246, 246, 246, .68);
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 38%),
        var(--color-background);
      color: var(--color-text);
    }
    a { color: inherit; }
    button, input, select { font: inherit; }
    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 36px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .logo {
      width: 46px;
      height: 46px;
      object-fit: contain;
      border-radius: 10px;
      background: var(--color-card);
      border: 1px solid rgba(255,255,255,.12);
      display: none;
      padding: 4px;
    }
    .logo-mark {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--color-primary);
      font-weight: 800;
      letter-spacing: 0;
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.05;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    .brand-meta, .status-row {
      color: var(--color-muted);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      padding: 5px 9px;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .button {
      border: 0;
      min-height: 38px;
      border-radius: 8px;
      padding: 0 14px;
      color: #fff;
      background: var(--color-button);
      cursor: pointer;
    }
    .button.secondary {
      color: var(--color-text);
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.12);
    }
    .hero {
      min-height: 220px;
      display: grid;
      align-items: end;
      padding: 34px 0 22px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .hero h2 {
      margin: 0;
      max-width: 820px;
      font-size: clamp(32px, 7vw, 78px);
      line-height: .95;
      letter-spacing: 0;
    }
    .hero p {
      margin: 14px 0 0;
      max-width: 640px;
      color: var(--color-muted);
      font-size: 16px;
      line-height: 1.55;
    }
    .notice {
      margin: 26px 0;
      padding: 18px;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
    }
    .notice strong { display: block; margin-bottom: 6px; }
    .features, .providers, .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0;
    }
    .section {
      margin-top: 30px;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }
    .section-head h3 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    .section-head span {
      color: var(--color-muted);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
    }
    .game, .banner, .provider, .category {
      border-radius: 8px;
      background: var(--color-card);
      border: 1px solid rgba(255,255,255,.1);
      overflow: hidden;
      min-width: 0;
    }
    .thumb {
      aspect-ratio: 16/11;
      background:
        linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.04)),
        var(--color-primary);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .game-body, .provider, .category, .banner-body {
      padding: 12px;
    }
    .name {
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .sub {
      margin-top: 6px;
      color: var(--color-muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .banner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    .banner .thumb { aspect-ratio: 21/8; }
    .empty {
      border: 1px dashed rgba(255,255,255,.16);
      color: var(--color-muted);
      border-radius: 8px;
      padding: 18px;
      background: rgba(255,255,255,.04);
    }
    .footer {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.1);
      color: var(--color-muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .hidden { display: none !important; }
    @media (max-width: 680px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 10px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .hero { min-height: 180px; padding-top: 16px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar">
      <div class="brand">
        <img id="brandLogo" class="logo" alt="">
        <div id="logoMark" class="logo-mark">WL</div>
        <div>
          <h1 id="appName">White Label</h1>
          <div class="brand-meta">
            <span id="domain" class="pill"></span>
            <span id="country" class="pill"></span>
            <span id="currency" class="pill"></span>
            <span id="language" class="pill"></span>
          </div>
        </div>
      </div>
      <div class="actions">
        <a id="customerService" class="button secondary hidden" href="#" target="_blank" rel="noreferrer">Support</a>
        <button class="button" type="button" data-feature="deposit">Deposit</button>
        <button class="button secondary" type="button" data-feature="withdraw">Withdraw</button>
      </div>
    </nav>

    <section class="hero">
      <div>
        <h2 id="heroTitle">Loading</h2>
        <p id="heroCopy"></p>
        <div id="statusRow" class="status-row"></div>
      </div>
    </section>

    <section id="notice" class="notice hidden"></section>
    <section id="features" class="features"></section>
    <section id="lobby"></section>

    <footer class="footer">
      <span id="copyright"></span>
      <span id="timezone"></span>
    </footer>
  </main>

  <script>
    const state = { bootstrap: null, lobby: null };
    const featureLabels = {
      vip: "VIP",
      promotion: "Promotions",
      referral: "Referral",
      deposit: "Deposit",
      withdraw: "Withdraw",
      chat: "Chat",
      mission: "Missions",
      jackpot: "Jackpot"
    };

    function byId(id) {
      return document.getElementById(id);
    }

    function text(value, fallback = "") {
      return value === undefined || value === null || value === "" ? fallback : String(value);
    }

    function first(...values) {
      for (const value of values) {
        if (value !== undefined && value !== null && String(value).trim() !== "") return String(value).trim();
      }
      return "";
    }

    async function api(path) {
      const response = await fetch(path, { headers: { Accept: "application/json" } });
      const payload = await response.json().catch(() => ({}));
      if (payload && typeof payload.code !== "undefined" && payload.code !== 0) {
        throw new Error(payload.msg || "Request failed");
      }
      return payload && Object.prototype.hasOwnProperty.call(payload, "data") ? payload.data : payload;
    }

    function setCSSVar(name, value) {
      if (value) document.documentElement.style.setProperty(name, value);
    }

    function applyTheme(theme = {}) {
      setCSSVar("--color-primary", theme.primary);
      setCSSVar("--color-secondary", theme.secondary);
      setCSSVar("--color-accent", theme.accent);
      setCSSVar("--color-background", theme.background);
      setCSSVar("--color-card", theme.card);
      setCSSVar("--color-button", theme.button || theme.primary);
      setCSSVar("--color-text", theme.text);
    }

    function applyBranding(data) {
      const brand = data.branding || {};
      const appName = first(brand.appName, data.site && data.site.siteName, data.tenant && data.tenant.tenantName, "White Label");
      document.title = first(brand.seoTitle, appName);
      byId("appName").textContent = appName;
      byId("heroTitle").textContent = appName;
      byId("heroCopy").textContent = first(brand.seoDescription, data.site && data.site.siteName, data.tenant && data.tenant.tenantName);
      byId("domain").textContent = first(data.domain, location.host);
      byId("country").textContent = first(data.country && (data.country.nameEn || data.country.code), "Country");
      const currency = data.currency || {};
      byId("currency").textContent = first(currency.symbol, "") + " " + first(currency.code, "Currency");
      byId("language").textContent = first(data.language && data.language.default, "Language");
      byId("timezone").textContent = first(data.timezone, "");
      byId("copyright").textContent = first(brand.copyright, appName);

      const logo = byId("brandLogo");
      const logoMark = byId("logoMark");
      if (brand.logo) {
        logo.src = brand.logo;
        logo.alt = appName;
        logo.classList.remove("hidden");
        logo.style.display = "block";
        logoMark.classList.add("hidden");
      } else {
        logo.removeAttribute("src");
        logo.style.display = "none";
        logoMark.textContent = appName.slice(0, 2).toUpperCase();
        logoMark.classList.remove("hidden");
      }
      if (brand.favicon) {
        const link = document.querySelector("link[rel='icon']") || document.createElement("link");
        link.rel = "icon";
        link.href = brand.favicon;
        document.head.appendChild(link);
      }
      const service = byId("customerService");
      const support = first(brand.customerService, brand.telegram, brand.email);
      if (support) {
        service.href = support.includes("@") && !support.startsWith("http") ? "mailto:" + support : support;
        service.classList.remove("hidden");
      } else {
        service.classList.add("hidden");
      }
    }

    function renderFeatures(features = {}) {
      const container = byId("features");
      container.innerHTML = "";
      Object.entries(featureLabels).forEach(([key, label]) => {
        const enabled = features[key] !== false && features[key] !== "false" && features[key] !== 0;
        document.querySelectorAll(`[data-feature="${key}"]`).forEach((node) => node.classList.toggle("hidden", !enabled));
        if (!enabled) return;
        const item = document.createElement("span");
        item.className = "pill";
        item.textContent = label;
        container.appendChild(item);
      });
    }

    function showNotice(title, message) {
      const notice = byId("notice");
      notice.innerHTML = `<strong>${escapeHTML(title)}</strong><span>${escapeHTML(message || "")}</span>`;
      notice.classList.remove("hidden");
    }

    function escapeHTML(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
    }

    function statusLabel(status) {
      if (status === 1) return "enabled";
      if (status === 2) return "maintenance";
      if (status === 3) return "disabled";
      return text(status, "");
    }

    function renderStatus(data) {
      const row = byId("statusRow");
      row.innerHTML = "";
      const items = [
        ["Tenant", data.tenant && first(data.tenant.tenantCode, data.tenant.tenantName)],
        ["Site", data.site && first(data.site.siteCode, data.site.siteName)],
        ["Plan", data.tenant && first(data.tenant.packageCode, data.tenant.planCode)],
        ["Config", data.configVersion || 1],
        ["Providers", Array.isArray(data.providers) ? data.providers.length : 0]
      ];
      items.forEach(([label, value]) => {
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = `${label}: ${text(value, "-")}`;
        row.appendChild(pill);
      });
    }

    function imageBlock(url, label) {
      return `<div class="thumb">${url ? `<img src="${escapeHTML(url)}" alt="">` : `<span>${escapeHTML(label || "")}</span>`}</div>`;
    }

    function sectionShell(title, count, body) {
      return `
        <section class="section">
          <div class="section-head">
            <h3>${escapeHTML(title)}</h3>
            <span>${count} items</span>
          </div>
          ${body}
        </section>
      `;
    }

    function renderGameGrid(items) {
      if (!Array.isArray(items) || items.length === 0) return `<div class="empty">No games</div>`;
      return `<div class="grid">${items.map((game) => `
        <article class="game">
          ${imageBlock(first(game.thumbnailUrl, game.thumbnailURL, game.coverUrl, game.localThumbnailUrl, game.launchImageUrl), first(game.name, game.gameCode))}
          <div class="game-body">
            <div class="name">${escapeHTML(first(game.name, game.gameCode))}</div>
            <div class="sub">${escapeHTML(first(game.providerCode, game.gameType, game.category))}</div>
          </div>
        </article>
      `).join("")}</div>`;
    }

    function renderBannerGrid(items) {
      if (!Array.isArray(items) || items.length === 0) return `<div class="empty">No banners</div>`;
      return `<div class="banner-grid">${items.map((banner) => `
        <article class="banner">
          ${imageBlock(first(banner.imageUrl, banner.imageURL), first(banner.title, banner.bannerCode))}
          <div class="banner-body">
            <div class="name">${escapeHTML(first(banner.title, banner.bannerCode))}</div>
            <div class="sub">${escapeHTML(first(banner.position, banner.linkType))}</div>
          </div>
        </article>
      `).join("")}</div>`;
    }

    function renderProviderGrid(items) {
      if (!Array.isArray(items) || items.length === 0) return `<div class="empty">No providers</div>`;
      return `<div class="providers">${items.map((provider) => `
        <div class="provider">
          <div class="name">${escapeHTML(first(provider.name, provider.providerName, provider.providerCode))}</div>
          <div class="sub">${escapeHTML(first(provider.providerCode, statusLabel(provider.status)))}</div>
        </div>
      `).join("")}</div>`;
    }

    function renderCategoryGrid(items) {
      if (!Array.isArray(items) || items.length === 0) return `<div class="empty">No categories</div>`;
      return `<div class="categories">${items.map((category) => `
        <div class="category">
          <div class="name">${escapeHTML(first(category.nameEn, category.nameZh, category.code))}</div>
          <div class="sub">${escapeHTML(first(category.code, category.categoryKey))}</div>
        </div>
      `).join("")}</div>`;
    }

    function renderJackpot(item) {
      if (!item) return `<div class="empty">No jackpot</div>`;
      if (typeof item !== "object") return `<div class="notice">${escapeHTML(item)}</div>`;
      const amount = first(item.amount, item.value, item.total, "0");
      const currency = state.bootstrap && state.bootstrap.currency ? first(state.bootstrap.currency.code, "") : "";
      return `<div class="notice"><strong>${escapeHTML(currency)} ${escapeHTML(amount)}</strong><span>${escapeHTML(first(item.title, item.name, "Jackpot"))}</span></div>`;
    }

    function renderSection(section) {
      const code = first(section.sectionCode, section.code);
      const title = first(section.titleEn, section.titleZh, code);
      const items = section.items;
      if (code === "top-banner") return sectionShell(title, Array.isArray(items) ? items.length : 0, renderBannerGrid(items));
      if (code === "providers") return sectionShell(title, Array.isArray(items) ? items.length : 0, renderProviderGrid(items));
      if (code === "categories") return sectionShell(title, Array.isArray(items) ? items.length : 0, renderCategoryGrid(items));
      if (code === "jackpot") return sectionShell(title, items ? 1 : 0, renderJackpot(items));
      return sectionShell(title, Array.isArray(items) ? items.length : 0, renderGameGrid(items));
    }

    function renderLobby(lobby) {
      const container = byId("lobby");
      const sections = Array.isArray(lobby.sections) ? lobby.sections : [];
      if (sections.length > 0) {
        container.innerHTML = sections.map(renderSection).join("");
        return;
      }
      container.innerHTML = [
        sectionShell("Banners", (lobby.banners || []).length, renderBannerGrid(lobby.banners)),
        sectionShell("Hot Games", (lobby.hotGames || []).length, renderGameGrid(lobby.hotGames)),
        sectionShell("New Games", (lobby.newGames || []).length, renderGameGrid(lobby.newGames)),
        sectionShell("Recommended", (lobby.recommendedGames || []).length, renderGameGrid(lobby.recommendedGames)),
        sectionShell("Categories", (lobby.categories || []).length, renderCategoryGrid(lobby.categories)),
        sectionShell("Providers", (lobby.providers || []).length, renderProviderGrid(lobby.providers))
      ].join("");
    }

    async function boot() {
      try {
        const bootstrap = await api("/api/v1/bootstrap");
        state.bootstrap = bootstrap;
        localStorage.setItem("wl.bootstrap", JSON.stringify(bootstrap));
        applyTheme(bootstrap.theme || {});
        applyBranding(bootstrap);
        renderFeatures(bootstrap.features || {});
        renderStatus(bootstrap);

        const tenantID = Number(bootstrap.tenant && bootstrap.tenant.id || 0);
        const siteID = Number(bootstrap.site && bootstrap.site.id || 0);
        if (!tenantID || !siteID) {
          showNotice("Domain is not bound", `Host ${location.host} is not mapped to an active tenant site.`);
          byId("heroCopy").textContent = "Create or bind this domain in the platform admin before the lobby can open.";
          return;
        }
        if (bootstrap.maintenance && bootstrap.maintenance.enabled) {
          showNotice("Maintenance", first(bootstrap.maintenance.message, "Site is under maintenance"));
          return;
        }

        const country = bootstrap.country && bootstrap.country.code ? `country=${encodeURIComponent(bootstrap.country.code)}` : "";
        const currency = bootstrap.currency && bootstrap.currency.code ? `currency=${encodeURIComponent(bootstrap.currency.code)}` : "";
        const query = [country, currency].filter(Boolean).join("&");
        const lobby = await api(`/api/v1/lobby${query ? "?" + query : ""}`);
        state.lobby = lobby;
        renderLobby(lobby || {});
      } catch (error) {
        showNotice("Unable to open site", error.message || "Request failed");
        byId("heroTitle").textContent = "Site unavailable";
        byId("heroCopy").textContent = "";
      }
    }

    boot();
  </script>
</body>
</html>
